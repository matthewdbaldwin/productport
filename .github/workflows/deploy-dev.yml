name: Deploy to AWS (dev)

# Builds the develop branch into :dev images and rolls the productport-dev service
# in the microport-dev cluster. Mirrors the fleet (clinicport) two-image pattern:
# <app>-api (root Dockerfile) + <app>-web (web/Dockerfile). Same OIDC role.

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 682624892433.dkr.ecr.eu-central-1.amazonaws.com
  ECS_CLUSTER: microport-dev
  ECS_SERVICE: productport-dev

jobs:
  deploy-dev:
    name: Build & Deploy (dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::682624892433:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push productport-api:dev
        env:
          DOCKER_BUILDKIT: 1
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build --secret id=npm_token,env=NODE_AUTH_TOKEN -t $ECR_REGISTRY/productport-api:dev .
          docker push $ECR_REGISTRY/productport-api:dev

      - name: Build and push productport-web:dev
        env:
          DOCKER_BUILDKIT: 1
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN:      ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker build \
            --build-arg API_URL=http://localhost:4006 \
            --secret id=npm_token,env=NODE_AUTH_TOKEN \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN \
            --secret id=sentry_token,env=SENTRY_AUTH_TOKEN \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=development \
            -t $ECR_REGISTRY/productport-web:dev ./web
          docker push $ECR_REGISTRY/productport-web:dev

      - name: Deploy to ECS (dev)
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --output json \
            --query "service.{service:serviceName,status:status}" \
            | cat

      - name: Wait for ECS rollover (dev)
        run: |
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE --region $AWS_REGION \
          || aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE --region $AWS_REGION
