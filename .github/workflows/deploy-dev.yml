name: Deploy to AWS (dev)

# Builds the develop branch into :dev images and rolls the productport-dev service
# in the microport-dev cluster (the dev mesh), via the fleet's reusable
# deploy-dev workflow hosted in microport-infra. See
# matthewdbaldwin/microport-infra .github/workflows/deploy-dev-reusable.yml
# for the full job body, permissions, and secrets rationale — this file only
# keeps the parts that must stay local to this repo: the trigger, the
# concurrency group, the `permissions:` ceiling the reusable job needs, and
# this repo's own slug/port/build-arg values.
#
# Mirrors the fleet two-image pattern: <app>-api (root Dockerfile) +
# <app>-web (web/Dockerfile). Same OIDC role.
#
# REF CAVEAT: pinned to @feat/deploy-dev-reusable-workflow (a branch, not yet a tag/main) because
# matthewdbaldwin/microport-infra's companion PR introducing this reusable
# workflow has not merged yet. Update this ref to @main (or a released tag)
# once that PR merges — do not leave it pointed at a branch long-term.

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy-dev:
    uses: matthewdbaldwin/microport-infra/.github/workflows/deploy-dev-reusable.yml@feat/deploy-dev-reusable-workflow
    with:
      slug: productport
      api_port: "4006"
    secrets:
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
