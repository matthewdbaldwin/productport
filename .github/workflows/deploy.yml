name: Deploy to AWS (prod)

# Builds main into :latest images and rolls the productport service in the
# microport (prod) cluster. Two-image fleet pattern: productport-api (root
# Dockerfile) + productport-web (web/Dockerfile). Same OIDC role.

on:
  # Manual only (2026-09-01). Routine prod deploys now run from the devbox with
  # `deploy-local productport prod`; this workflow is the break-glass path for when the
  # devbox is unavailable. It no longer fires on its own.
  #
  # WHAT THE FLIP COST, AND HOW IT WAS PAID BACK: the old `workflow_run` trigger
  # guaranteed a GREEN CI run on main before anything shipped
  # (feedback_deploy_does_not_gate_on_ci). The flip to workflow_dispatch dropped
  # that guarantee, and for five days this break-glass path was the only route to
  # prod with no CI gate — the devbox path (`deploy-local`) kept one. Restored
  # 2026-09-06 as the "Verify CI is green for this commit" step below, which reads
  # the CI conclusion for the exact resolved sha. Both halves of the old gate are
  # now enforced again: the branch guard on the job (only main/master reaches prod)
  # and the CI-conclusion check (only green commits do).
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit id to deploy, must be on the selected branch (blank = branch tip)"
        required: false
        default: ""
      skip_ci_check:
        description: "Ship even if CI is not green for this commit (logged loudly; use only to break glass)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-prod-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 682624892433.dkr.ecr.eu-central-1.amazonaws.com
  ECS_CLUSTER: microport
  ECS_SERVICE: productport

jobs:
  deploy:
    name: Build & Deploy (prod)
    runs-on: ubuntu-latest
    # One half of the old gate: prod ships from main/master and nowhere else.
    # The CI-conclusion half is no longer inferred from a triggering workflow_run
    # (a dispatch has none) — it is looked up explicitly by sha in the
    # "Verify CI is green for this commit" step below.
    if: ${{ (github.ref_name == 'main' || github.ref_name == 'master') }}
    steps:
      # The branch guard above proves only WHERE the deploy was dispatched from, not
      # WHAT it ships: `inputs.sha` can name a commit on any branch, so dispatching
      # from main with a feature-branch sha would sail past the guard. The old
      # workflow_run trigger could not do that — its head_sha was by construction a
      # commit CI had run on main. This step re-establishes that invariant.
      #
      # TWO checks, and the first is what makes the second meaningful:
      #
      # 1. FORMAT. The input must be a full 40-hex commit id, never a branch or tag.
      #    A mutable ref would make this whole step a time-of-check/time-of-use hole:
      #    `compare` resolves the ref here, `actions/checkout` resolves it AGAIN a step
      #    later, and between those two resolutions the ref can be repointed at any
      #    commit. A full commit id cannot be repointed, so what is verified is exactly
      #    what is built. Abbreviated ids are refused too: they can grow ambiguous.
      #
      # 2. ANCESTRY. `compare/BASE...HEAD` reports `identical` when the sha IS the
      #    branch tip and `behind` when it is an older commit on that branch; anything
      #    else (`ahead`, `diverged`) means the sha is not on the branch, so refuse.
      #
      # Scope note: dispatching already requires repo write access, so this is
      # defence in depth against a mistake or a compromised collaborator, not a
      # trust boundary against someone who could simply push to main.
      - name: Verify requested commit is on the deploy branch
        if: ${{ inputs.sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          BRANCH:   ${{ github.ref_name }}
          SHA:      ${{ inputs.sha }}
        run: |
          # bash's =~ anchors ^/$ to the WHOLE string. `grep -Eq` anchors them
          # per LINE and succeeds if ANY line matches, so a multi-line input
          # ("<40-hex>\n<junk>") sailed past this check, leaving the ancestry
          # check below as the only real guard. Caught pre-ship, 2026-09-01.
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "REFUSED: sha input must be a full 40-character lowercase commit id." >&2
            echo "         Got: '$SHA'. Branch and tag names are rejected on purpose —" >&2
            echo "         a mutable ref can be repointed between this check and checkout." >&2
            exit 1
          fi
          STATUS=$(gh api "repos/$REPO/compare/$BRANCH...$SHA" --jq .status)
          echo "compare $BRANCH...$SHA -> $STATUS"
          case "$STATUS" in
            identical|behind)
              echo "OK: $SHA is on $BRANCH" ;;
            *)
              echo "REFUSED: $SHA is not on $BRANCH (status=$STATUS)" >&2
              exit 1 ;;
          esac

      # The half of the old `workflow_run` gate that the 2026-09-01 flip to
      # workflow_dispatch dropped: proof that CI actually PASSED for the commit
      # being shipped. The branch + format + ancestry checks above prove the sha
      # is on main; none of them prove it is green. Until this step existed the
      # devbox path (`deploy-local`, which has its own CI gate) was gated and this
      # break-glass path was not, so the safer-looking route was the unguarded one.
      #
      # Reads the CI conclusion for the exact resolved sha. Uses the REST API
      # rather than `gh run list --commit`, which returns EMPTY for some repos in
      # this fleet even when runs exist (observed on hubport, 2026-09-06) — an
      # empty list would read as "no CI" and refuse a perfectly good deploy.
      #
      # Re-runs create several runs for one sha, so the MOST RECENT is what counts:
      # a red first attempt followed by a green re-run is green.
      - name: Verify CI is green for this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ inputs.sha || github.sha }}
        run: |
          RUNS=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                   --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")]')
          [ -n "$RUNS" ] || RUNS='[]'
          N=$(echo "$RUNS" | jq 'length')
          if [ "$N" -eq 0 ]; then
            echo "REFUSED: no CI run found for $SHA." >&2
            echo "         Push the commit and let CI finish, or re-dispatch with" >&2
            echo "         skip_ci_check=true if you are deliberately breaking glass." >&2
            exit 1
          fi
          read -r ST CC URL <<<"$(echo "$RUNS" | jq -r \
            'sort_by(.run_started_at // .created_at) | last | "\(.status) \(.conclusion) \(.html_url)"')"
          echo "latest CI run for $SHA: status=$ST conclusion=$CC"
          echo "$URL"
          if [ "$ST" != "completed" ]; then
            echo "REFUSED: CI has not finished (status=$ST). Wait for it." >&2
            exit 1
          fi
          if [ "$CC" != "success" ]; then
            echo "REFUSED: CI concluded '$CC' for $SHA — refusing to ship a red commit." >&2
            exit 1
          fi
          echo "OK: CI is green for $SHA ($N run(s) inspected)."

      - name: Break-glass notice
        if: ${{ inputs.skip_ci_check }}
        run: |
          echo "::warning title=CI check skipped::Deploying ${{ inputs.sha || github.sha }} WITHOUT a green CI check (skip_ci_check=true)."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Deploy the exact commit asked for; blank input falls back to the tip of
          # the dispatched branch (empty string is falsy in GHA expressions). Both
          # arms are immutable commit ids by the time they land here: a non-blank
          # input was proven 40-hex AND on this branch by the step above, and
          # `github.sha` is pinned at dispatch time. Neither can be repointed.
          ref: ${{ inputs.sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::682624892433:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push productport-api:latest
        env:
          DOCKER_BUILDKIT: 1
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build --secret id=npm_token,env=NODE_AUTH_TOKEN -t $ECR_REGISTRY/productport-api:latest .
          docker push $ECR_REGISTRY/productport-api:latest

      - name: Build and push productport-web:latest
        env:
          DOCKER_BUILDKIT: 1
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sentry: DSN baked into the browser bundle, AUTH_TOKEN authorises
          # source-map upload during the build. Both are pulled from GH
          # secrets; neither is carried into the runtime task definition
          # (runtime SENTRY_DSN is baked into the image at build time).
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN:      ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker build \
            --build-arg API_URL=http://localhost:4006 \
            --secret id=npm_token,env=NODE_AUTH_TOKEN \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN \
            --secret id=sentry_token,env=SENTRY_AUTH_TOKEN \
            -t $ECR_REGISTRY/productport-web:latest ./web
          docker push $ECR_REGISTRY/productport-web:latest

      - name: Deploy to ECS (prod)
        run: |
          # Re-pin to the LATEST registered task-def revision so a task-def CONFIG change
          # (env var, Secrets Manager migration) actually gets adopted — the flag-less
          # --force-new-deployment only ever redeployed the already-pinned revision, silently
          # stranding config/secrets changes. Requires iam:PassRole on productport-task-role
          # for GitHubActionsDeployRole (granted 2026-07-24). No `| cat`: the step runs under
          # `bash -e` without pipefail, so a pipe masks a failed deploy as green;
          # --no-cli-pager avoids the pager without a pipe.
          # See feedback_ecs_update_service_omits_task_definition.
          LATEST_TD=$(aws ecs describe-task-definition --task-definition "$ECS_SERVICE" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Deploying task definition: $LATEST_TD"
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition "$LATEST_TD" \
            --force-new-deployment \
            --no-cli-pager \
            --output json \
            --query "service.{service:serviceName,taskDefinition:taskDefinition,status:status}"

      - name: Wait for ECS rollover (prod)
        run: |
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE --region $AWS_REGION \
          || aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE --region $AWS_REGION
